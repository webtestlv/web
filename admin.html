<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Dzintars — админка</title>
<style>
/* ═════════ Цвета: светлая тема по умолчанию, тёмная — по настройке системы ═════════ */
:root{
  color-scheme:light;
  --bg:#F3F6F7; --surface:#FFFFFF; --surface-2:#EEF3F5; --line:#DAE3E8; --line-strong:#BFCDD4;
  --text:#111827; --muted:#55636C; --faint:#76858E;
  --teal-900:#0D3B43; --teal-700:#185863; --accent:#2E8FA3; --link:#0F6477;
  --amber:#F5C21E; --amber-600:#E5A400; --amber-soft:#FFF3CF; --amber-ink:#6B4A00;
  --nav-bg:#0D3B43; --nav-text:#CFE3E8; --nav-hover:#14505A; --nav-active:#185863;
  --btn-bg:#185863; --btn-fg:#FFFFFF; --btn-hover:#0D3B43;
  --danger:#B42318; --danger-hover:#8E1B12;
  --ok-bg:#E2F4E9; --ok-fg:#13613A; --bad-bg:#FDE7E4; --bad-fg:#9F2A1F;
  --warn-bg:#FFF1C4; --warn-fg:#6B4A00; --mute-bg:#E8EDF0; --mute-fg:#44525B; --info-bg:#DDEFF4; --info-fg:#0E5A69;
  --chip-bg:#F1F6F8; --chip-line:#CFDCE2;
  --b-buyer:#E3F0F4; --b-buyer-line:#B5D5DE; --b-seller:#FFF1C9; --b-seller-line:#EBD083; --b-other:#EDEFF1;
  --shadow:0 1px 2px rgba(13,59,67,.06),0 6px 18px rgba(13,59,67,.06);
  --focus:#1B8CA6; --overlay:rgba(7,22,26,.55);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F1619; --surface:#172127; --surface-2:#1D2A31; --line:#2A3A42; --line-strong:#3B4E58;
    --text:#E7EEF1; --muted:#A0B1B9; --faint:#81949D;
    --link:#6CC6DA; --amber-soft:#3B3010; --amber-ink:#F5C21E;
    --nav-bg:#0A2A30; --nav-text:#C6DDE2; --nav-hover:#123B44; --nav-active:#17505B;
    --btn-bg:#1F7A8E; --btn-fg:#FFFFFF; --btn-hover:#2E8FA3;
    --danger:#C5392C; --danger-hover:#D9503F;
    --ok-bg:#16382A; --ok-fg:#86DDAB; --bad-bg:#43211E; --bad-fg:#FFA79E;
    --warn-bg:#42350D; --warn-fg:#F5C21E; --mute-bg:#26333A; --mute-fg:#A9B8BF; --info-bg:#173842; --info-fg:#8ED0E0;
    --chip-bg:#1D2A31; --chip-line:#34464F;
    --b-buyer:#173640; --b-buyer-line:#2A5560; --b-seller:#3A3010; --b-seller-line:#6B5A1E; --b-other:#222E34;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.25);
    --focus:#5FC0D6; --overlay:rgba(0,0,0,.65);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F1619; --surface:#172127; --surface-2:#1D2A31; --line:#2A3A42; --line-strong:#3B4E58;
  --text:#E7EEF1; --muted:#A0B1B9; --faint:#81949D;
  --link:#6CC6DA; --amber-soft:#3B3010; --amber-ink:#F5C21E;
  --nav-bg:#0A2A30; --nav-text:#C6DDE2; --nav-hover:#123B44; --nav-active:#17505B;
  --btn-bg:#1F7A8E; --btn-fg:#FFFFFF; --btn-hover:#2E8FA3;
  --danger:#C5392C; --danger-hover:#D9503F;
  --ok-bg:#16382A; --ok-fg:#86DDAB; --bad-bg:#43211E; --bad-fg:#FFA79E;
  --warn-bg:#42350D; --warn-fg:#F5C21E; --mute-bg:#26333A; --mute-fg:#A9B8BF; --info-bg:#173842; --info-fg:#8ED0E0;
  --chip-bg:#1D2A31; --chip-line:#34464F;
  --b-buyer:#173640; --b-buyer-line:#2A5560; --b-seller:#3A3010; --b-seller-line:#6B5A1E; --b-other:#222E34;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.25);
  --focus:#5FC0D6; --overlay:rgba(0,0,0,.65);
}

/* ═════════ База ═════════ */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 var(--sans);overflow-x:hidden}
body.modal-open{overflow:hidden}
a{color:var(--link)}
h1,h2,h3,h4{line-height:1.25;margin:0}
h1{font-size:1.55rem} h2{font-size:1.15rem} h3{font-size:1.02rem}
p{margin:0 0 .6em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.muted{color:var(--muted)} .faint{color:var(--faint)} .mono{font-family:var(--mono)}
.nowrap{white-space:nowrap}
.ico{display:inline-flex;align-items:center;justify-content:center;flex:none}
.ico svg{display:block}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap-any{overflow-wrap:anywhere;word-break:break-word}

/* ═════════ Кнопки, поля ═════════ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:8px 16px;border-radius:10px;border:1px solid transparent;background:var(--btn-bg);color:var(--btn-fg);font-weight:600;cursor:pointer;text-decoration:none;line-height:1.2;text-align:center}
.btn:hover{background:var(--btn-hover)}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--link);border-color:var(--line-strong)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{background:var(--danger-hover)}
.btn-warn{background:var(--amber);color:#2B2000}.btn-warn:hover{background:var(--amber-600)}
.btn-sm{min-height:34px;padding:4px 12px;font-size:.92rem;border-radius:8px}
.btn-block{width:100%}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:10px;border:0;background:transparent;color:inherit;cursor:pointer}
.icon-btn:hover{background:rgba(127,127,127,.18)}
.field{display:grid;gap:6px;margin:0 0 14px}
.field>label,.lbl{font-weight:600;font-size:.92rem}
.hint{font-size:.85rem;color:var(--muted)}
input[type=text],input[type=search],input[type=password],input:not([type]),select,textarea{width:100%;min-height:42px;padding:9px 12px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--text)}
textarea{min-height:96px;resize:vertical;line-height:1.45}
input[type=checkbox],input[type=radio]{width:20px;height:20px;accent-color:var(--teal-700);flex:none}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check span{padding-top:1px}
.form-error{background:var(--bad-bg);color:var(--bad-fg);border-radius:10px;padding:10px 12px;margin:0 0 12px;font-weight:600}
.counter{font-size:.85rem;color:var(--muted);text-align:right}
.counter.over{color:var(--bad-fg);font-weight:700}

/* ═════════ Бейджи, чипы, ID ═════════ */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:700;line-height:1.5;white-space:nowrap;background:var(--mute-bg);color:var(--mute-fg)}
.b-ok{background:var(--ok-bg);color:var(--ok-fg)} .b-bad{background:var(--bad-bg);color:var(--bad-fg)}
.b-warn{background:var(--warn-bg);color:var(--warn-fg)} .b-mute{background:var(--mute-bg);color:var(--mute-fg)} .b-info{background:var(--info-bg);color:var(--info-fg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:4px 14px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);color:var(--text);cursor:pointer;font-weight:600;font-size:.92rem}
.chip:hover{background:var(--surface-2)}
.chip[aria-pressed="true"]{background:var(--teal-700);border-color:var(--teal-700);color:#fff}
.chip .n{font-weight:700;opacity:.8}
.ref{display:inline-flex;align-items:stretch;max-width:100%;border:1px solid var(--chip-line);background:var(--chip-bg);border-radius:8px;font-family:var(--mono);font-size:.86rem;font-weight:700;vertical-align:middle;position:relative;z-index:2;overflow:hidden}
.ref a{display:inline-flex;align-items:center;padding:1px 8px;color:var(--link);text-decoration:none;overflow-wrap:anywhere;min-width:0}
.ref a:hover{text-decoration:underline}
.ref button{border:0;border-left:1px solid var(--chip-line);background:transparent;color:var(--muted);padding:0 8px;min-width:30px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.ref button:hover{background:var(--surface-2);color:var(--text)}
.ref-sm{font-size:.76rem}.ref-sm a{padding:0 6px}.ref-sm button{min-width:26px;padding:0 5px}
.ref-lg{font-size:1.45rem;border-radius:12px}.ref-lg a{padding:6px 14px}.ref-lg button{padding:0 14px}
@media (pointer:coarse){.ref button{min-width:34px}.ref-sm button{min-width:32px}}

/* ═════════ Каркас: верхняя панель, меню, основная область ═════════ */
.app{min-height:100vh;display:grid;grid-template-columns:236px minmax(0,1fr);grid-template-rows:auto 1fr;grid-template-areas:"top top" "nav main"}
.topbar{grid-area:top;background:var(--nav-bg);color:#fff;display:flex;align-items:center;gap:14px;padding:8px 18px;position:sticky;top:0;z-index:40}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:700;white-space:nowrap}
.brand small{font-weight:500;opacity:.75;margin-left:2px}
.brand-mark{width:32px;height:32px;border-radius:9px;background:var(--amber);color:#2B2000;display:inline-flex;align-items:center;justify-content:center;font-weight:800}
.nav-toggle{display:none;color:#fff}
.search{position:relative;flex:1 1 auto;max-width:640px;margin:0 auto 0 12px}
.search input{padding-left:40px;background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.25)}
.search input::placeholder{color:rgba(255,255,255,.7)}
.search input:focus{background:var(--surface);color:var(--text);border-color:var(--accent)}
.search input:focus::placeholder{color:var(--faint)}
.search .search-ico{position:absolute;left:11px;top:11px;color:rgba(255,255,255,.85);pointer-events:none}
.search input:focus~.search-ico{color:var(--faint)}
.search-res{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);color:var(--text);border:1px solid var(--line-strong);border-radius:12px;box-shadow:0 12px 36px rgba(0,0,0,.3);max-height:min(70vh,560px);overflow:auto;z-index:60;padding:6px}
.sr-group{padding:8px 10px 2px;font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.sr-row{position:relative;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;min-height:48px}
.sr-row:hover,.sr-row.active{background:var(--surface-2)}
.sr-row.active{outline:2px solid var(--focus);outline-offset:-2px}
.sr-main{min-width:0;flex:1}
.sr-title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr-sub{font-size:.85rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr-status{padding:14px;color:var(--muted)}
.who{display:flex;align-items:center;gap:10px;margin-left:auto;white-space:nowrap}
.who-name{opacity:.85;font-size:.92rem}
.btn.on-dark{color:#fff;border-color:rgba(255,255,255,.4)}
.btn.on-dark:hover{background:rgba(255,255,255,.14)}
.nav{grid-area:nav;background:var(--nav-bg);color:var(--nav-text);padding:8px 10px 18px;display:flex;flex-direction:column;gap:2px;position:sticky;top:56px;align-self:start;height:calc(100vh - 56px);overflow:auto}
.nav a.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--nav-text);text-decoration:none;font-weight:600;min-height:44px}
.nav a.nav-item:hover{background:var(--nav-hover)}
.nav a.nav-item[aria-current="page"]{background:var(--nav-active);color:#fff;box-shadow:inset 3px 0 0 var(--amber)}
.nav-badge{margin-left:auto;background:var(--amber);color:#2B2000;border-radius:999px;font-size:.78rem;font-weight:800;padding:1px 8px;min-width:24px;text-align:center}
.nav-foot{margin-top:auto;padding:14px 12px 4px;font-size:.82rem;color:rgba(207,227,232,.75);overflow-wrap:anywhere}
.nav-foot kbd{font-family:var(--mono);background:rgba(255,255,255,.14);border-radius:5px;padding:0 6px}
.nav-back{display:none}
.main{grid-area:main;min-width:0;padding:22px 26px 56px;outline:none}
.main>*{max-width:1180px;margin-left:auto;margin-right:auto}
.page-head{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:space-between;margin:0 auto 18px}
.page-head h1{min-width:0;overflow-wrap:anywhere}
.page-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sec{margin:26px 0 12px;font-size:1.1rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.card+.card{margin-top:16px}
.card>h2:first-child,.card>h3:first-child{margin-bottom:10px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid-2>.card+.card{margin-top:0}
.stack>*+*{margin-top:16px}
.row-flex{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 14px;margin:0}
.kv dt{color:var(--muted);font-size:.9rem}.kv dd{margin:0;overflow-wrap:anywhere}

/* ═════════ Состояния: загрузка, пусто, ошибка ═════════ */
.state-box{padding:34px 16px;text-align:center;color:var(--muted)}
.state-box.loading{display:flex;gap:12px;align-items:center;justify-content:center}
.state-box.err{color:var(--bad-fg)}
.state-box .btn{margin-top:8px}
.spinner{width:20px;height:20px;border:3px solid var(--line-strong);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:2.4s}*{scroll-behavior:auto !important}}

/* ═════════ Строки списков (ссылка на всю строку) ═════════ */
.list{display:grid;gap:10px}
.row{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px;min-width:0}
.row:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.row.is-done{opacity:.86}
.row-link{position:absolute;inset:0;z-index:1;border-radius:12px}
.row-top,.row-people,.row-meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;min-width:0}
.row-people{font-weight:600}
.row-people .arrow{color:var(--faint)}
.row-text{color:var(--text);overflow-wrap:anywhere;white-space:pre-wrap}
.row-meta{font-size:.88rem;color:var(--muted)}
.person-inline{display:inline-flex;flex-wrap:wrap;gap:4px 8px;align-items:center;min-width:0}
.person-inline .pn{overflow-wrap:anywhere}

/* ═════════ Обзор ═════════ */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.stat{position:relative;display:flex;flex-direction:column;gap:2px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;text-decoration:none;color:var(--text);box-shadow:var(--shadow);min-height:96px}
.stat:hover{border-color:var(--accent)}
.stat .n{font-size:2rem;font-weight:800;line-height:1.1}
.stat .t{font-weight:600;color:var(--text)}
.stat .s{font-size:.82rem;color:var(--muted)}
.stat.hot{background:var(--amber-soft);border-color:var(--amber-600)}
.stat.hot .n{color:var(--amber-ink)}
.stat.big{grid-column:span 2}
.attention{display:grid;gap:10px}
.callout{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:var(--amber-soft);border:1px solid var(--amber-600);color:var(--amber-ink);border-radius:12px;padding:12px 16px;font-weight:600}
.callout a{color:inherit}
.callout.info{background:var(--info-bg);border-color:var(--accent);color:var(--info-fg)}
.callout.bad{background:var(--bad-bg);border-color:var(--danger);color:var(--bad-fg)}

/* ═════════ Вход ═════════ */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,var(--teal-900),var(--teal-700))}
.login-card{width:100%;max-width:400px;background:var(--surface);border-radius:18px;padding:26px 24px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.login-card .brand{color:var(--text);margin-bottom:14px;font-size:1.2rem}
.login-note{background:var(--amber-soft);color:var(--amber-ink);border:1px solid var(--amber-600);border-radius:10px;padding:10px 12px;margin:0 0 14px;font-weight:600}
.login-api{font-size:.85rem;color:var(--muted);margin:14px 0 0;overflow-wrap:anywhere}

/* ═════════ Окна и уведомления ═════════ */
.modal-back{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:center;justify-content:center;padding:16px;z-index:100;overflow:auto}
.modal{background:var(--surface);color:var(--text);border-radius:16px;width:100%;max-width:540px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.4);outline:none}
.modal.wide{max-width:680px}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 12px 10px 20px;border-bottom:1px solid var(--line)}
.modal-body{padding:16px 20px;overflow:auto;min-height:0}
.modal-foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;padding:12px 20px 16px;border-top:1px solid var(--line)}
.modal-note{background:var(--surface-2);border-radius:10px;padding:10px 12px;margin:0 0 14px}
.modal-note.warn{background:var(--amber-soft);color:var(--amber-ink)}
.modal-note.bad{background:var(--bad-bg);color:var(--bad-fg)}
.modal-note ul{margin:6px 0 0;padding-left:20px}
.quote{border-left:4px solid var(--line-strong);padding:6px 12px;background:var(--surface-2);border-radius:0 8px 8px 0;white-space:pre-wrap;overflow-wrap:anywhere;max-height:220px;overflow:auto}
#toasts{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:200;width:min(420px,calc(100vw - 32px))}
.toast{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--teal-900);color:#fff;box-shadow:0 8px 28px rgba(0,0,0,.35);font-weight:600}
.toast.t-err{background:var(--danger)}
.toast.t-info{background:var(--teal-700)}
.toast-txt{flex:1;min-width:0;overflow-wrap:anywhere}
.toast-x{border:0;background:transparent;color:inherit;cursor:pointer;padding:4px;opacity:.8;display:inline-flex}
/* ═════════ Общее для экранов ═════════ */
.sec{font-size:1.05rem;margin:22px 0 10px}
.list{display:grid;gap:10px}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg button,.chip-btn{min-height:36px;padding:4px 14px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);color:var(--text);font:inherit;font-size:.92rem;cursor:pointer}
.seg button[aria-pressed="true"],.chip-btn[aria-pressed="true"]{background:var(--btn-bg);border-color:var(--btn-bg);color:#fff}
.filters{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin:0 0 14px}
.filters input[type=search],.filters input[type=text],.filters select{width:auto;min-height:40px;padding:6px 12px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--text);font:inherit;min-width:0}
.filters input[type=search]{flex:1 1 220px}
.bar-actions{display:flex;flex-wrap:wrap;gap:8px}
.stars{color:var(--amber-600);letter-spacing:1px;font-size:1.05rem;white-space:nowrap}
.stars .off{color:var(--line-strong)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tab-bar{display:flex;gap:4px;overflow-x:auto;border-bottom:2px solid var(--line);margin:18px 0 14px;scrollbar-width:thin}
.tab-bar button{flex:0 0 auto;min-height:42px;padding:6px 14px;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;background:none;color:var(--muted);font:inherit;font-weight:600;cursor:pointer}
.tab-bar button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--amber-600)}
.notice-del{background:var(--mute-bg);color:var(--mute-fg);border:1px solid var(--line-strong);border-radius:12px;padding:12px 14px;margin:0 0 14px;font-weight:600}

/* ═════════ Люди ═════════ */
.person{display:grid;gap:10px;align-content:start}
.person-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.person-role{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.person-name{font-size:1.25rem;font-weight:800;overflow-wrap:anywhere}
.warn-flag{color:var(--bad-fg);font-weight:700}

/* ═════════ Читалка переписки ═════════ */
.reader-head{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin:0 0 10px}
.reader-tabs{margin:0 0 10px}
.reader-note{font-size:.9rem;margin:0 0 10px}
.reader{display:grid;gap:8px;max-height:640px;overflow:auto;padding:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px}
.day-sep{justify-self:center;font-size:.78rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 12px;margin:6px 0}
.msg{display:grid;gap:2px;max-width:min(560px,88%)}
.msg.m-buyer{justify-self:start}.msg.m-seller{justify-self:end}
.msg.m-system{justify-self:center;max-width:94%}
.msg-who{font-size:.78rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center}
.m-seller .msg-who{justify-content:flex-end}
.bubble{border-radius:14px;padding:8px 12px;white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid var(--b-buyer-line);background:var(--b-buyer);color:var(--text)}
.m-seller .bubble{background:var(--b-seller);border-color:var(--b-seller-line)}
.m-system .bubble{background:var(--b-other);border-color:var(--line);font-size:.9rem;text-align:center;color:var(--muted)}
.bubble.is-del{font-style:italic;color:var(--muted);background:transparent;border-style:dashed}
.msg-time{font-size:.74rem;color:var(--faint)}
.m-seller .msg-time{text-align:right}
.reader-empty{padding:26px;text-align:center;color:var(--muted)}

/* ═════════ Две колонки: список и переписка (Поддержка) ═════════ */
.split{display:grid;grid-template-columns:minmax(280px,360px) minmax(0,1fr);gap:16px;align-items:start}
.threads{display:grid;gap:8px;max-height:calc(100vh - 260px);overflow:auto;padding-right:2px}
.th{position:relative;display:grid;gap:4px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;text-decoration:none;color:inherit}
.th:hover{border-color:var(--accent)}
.th[aria-current="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--amber-600)}
.th.unread{background:var(--amber-soft)}
.th-top{display:flex;gap:8px;align-items:center;justify-content:space-between;min-width:0}
.th-name{font-weight:700;overflow-wrap:anywhere}
.th-last{font-size:.9rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.th-dot{min-width:22px;height:22px;border-radius:11px;background:var(--danger);color:#fff;font-size:.78rem;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.thread-pane{display:grid;gap:12px;min-width:0}
.thread-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.sup-msgs{display:grid;gap:8px;max-height:calc(100vh - 430px);min-height:180px;overflow:auto;padding:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px}
.sup-m{display:grid;gap:2px;max-width:min(560px,90%)}
.sup-m.in{justify-self:start}.sup-m.out{justify-self:end}
.sup-m .bubble{background:var(--surface);border-color:var(--line-strong)}
.sup-m.out .bubble{background:var(--b-buyer);border-color:var(--b-buyer-line)}
.sup-m.k-warning .bubble{background:var(--amber-soft);border-color:var(--amber-600)}
.sup-m.k-broadcast .bubble,.sup-m.k-system .bubble{background:var(--b-other);border-style:dashed}
.sup-m.out .msg-who{justify-content:flex-end}
.composer{display:grid;gap:8px}
.composer textarea{width:100%;min-height:84px;resize:vertical;padding:10px 12px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--text);font:inherit}
.composer-row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.pick{display:grid;gap:6px;margin-top:10px;max-height:260px;overflow:auto}
.pick button{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;text-align:left;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);font:inherit;cursor:pointer;min-height:44px}
.pick button:hover,.pick button:focus-visible{border-color:var(--accent);background:var(--surface-2)}

/* ═════════ Хронология, подсказки, аналитика ═════════ */
.timeline{display:grid;gap:0;margin:0;padding:0;list-style:none}
.timeline li{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.timeline li:last-child{border-bottom:0}
.timeline .when{color:var(--muted);font-size:.88rem}
.hint-card{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--amber-soft);color:var(--amber-ink);margin:0 0 8px}
.hint-card.info{background:var(--info-bg);color:var(--info-fg)}
.bars{display:flex;align-items:flex-end;gap:2px;height:96px;margin-top:8px}
.bars i{flex:1 1 0;min-width:3px;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.bars i.zero{background:var(--line-strong)}
.hbar{display:grid;grid-template-columns:minmax(90px,200px) minmax(0,1fr) auto;gap:8px;align-items:center;margin:6px 0}
.hbar .track{height:12px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.hbar .track i{display:block;height:100%;background:var(--accent)}
.audit-row{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 14px;padding:10px 0;border-bottom:1px solid var(--line)}
.audit-row:last-child{border-bottom:0}
.audit-what{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.audit-det{color:var(--muted);font-size:.9rem;overflow-wrap:anywhere;white-space:pre-wrap}

@media (max-width:940px){
  .split{grid-template-columns:minmax(0,1fr)}
  .split.has-thread .threads-col{display:none}
  .split:not(.has-thread) .thread-col{display:none}
  .threads{max-height:none}
  .sup-msgs{max-height:55vh}
  .timeline li,.audit-row{grid-template-columns:minmax(0,1fr)}
  .msg,.sup-m{max-width:94%}
  .hbar{grid-template-columns:minmax(70px,120px) minmax(0,1fr) auto}
}
.back-list{display:none}
@media (max-width:940px){.back-list{display:inline-flex}}

/* Version 12 */
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.thumbs a{display:block;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.thumbs img{display:block;width:120px;height:90px;object-fit:cover}
.listing-row .row-text,.banned-row .row-text{overflow-wrap:anywhere}


/* ═════════ Телефон ═════════ */
@media (max-width:940px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "main"}
  .topbar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"burger brand who" "search search search";gap:8px 6px;padding:8px 12px}
  .nav-toggle{display:inline-flex;grid-area:burger}
  .brand{grid-area:brand}.who{grid-area:who}
  .search{grid-area:search;max-width:none;margin:0}
  .who-name{display:none}
  .nav{position:fixed;left:0;top:0;bottom:0;height:auto;width:min(290px,86vw);z-index:90;transform:translateX(-102%);transition:transform .18s ease;padding-top:14px;box-shadow:8px 0 30px rgba(0,0,0,.35)}
  body.nav-open .nav{transform:none}
  body.nav-open .nav-back{display:block;position:fixed;inset:0;background:var(--overlay);z-index:80}
  .main{padding:16px 16px 56px}
  .grid-2{grid-template-columns:minmax(0,1fr)}
  .stat.big{grid-column:span 1}
  .stat-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  h1{font-size:1.35rem}
}
@media (max-width:480px){
  .brand small{display:none}
  .card{padding:14px}
  .modal-back{align-items:flex-end;padding:0}
  .modal{max-width:none;border-radius:16px 16px 0 0;max-height:92vh}
  #toasts{right:16px;left:16px;width:auto;bottom:12px}
  .kv{grid-template-columns:minmax(0,1fr)}
  .kv dt{margin-top:6px}
}
@media print{.topbar,.nav,#toasts{display:none}.app{display:block}}

<script>
(function () {

/* ═══════════════════════════════════════════════════════════════════════════
   1. Утилиты: построение DOM (всё через textContent — текст из API не попадает в разметку), даты
   ═══════════════════════════════════════════════════════════════════════════ */
const $ = (s, r) => (r || document).querySelector(s);

function append(el, kids) {
  for (const k of kids) {

  }
}
// h('div.card#id', {атрибуты, onclick}, ...дети) — дети: строки (как текст!), узлы, массивы
function h(tag, attrs, ...kids) {
  const m = /^([a-z][a-z0-9]*)?((?:[.#][\w-]+)*)$/i.exec(tag);
  const el = document.createElement(m && m[1] ? m[1] : 'div');
  if (m && m[2]) m[2].replace(/([.#])([\w-]+)/g, (_, k, v) => { if (k === '.') el.classList.add(v); else el.id = v; return ''; });

    for (const k of Object.keys(attrs)) {

      else if (k === 'hidden' || k === 'disabled') el[k] = !!v;

// Иконки — только константы (не данные из API), поэтому innerHTML здесь безопасен

};
function icon(name) { const s = document.createElement('span'); s.className = 'ico'; s.innerHTML = ICONS[name] || ''; return s; }

const pad2 = (n) => String(n).padStart(2, '0');
function plural(n, forms) { const a = Math.abs(n) % 100, b = a % 10; return forms[(a > 10 && a < 20) ? 2 : (b > 1 && b < 5) ? 1 : (b === 1) ? 0 : 2]; }
// API отдаёт UTC: «YYYY-MM-DD HH:MM:SS» или ISO с «Z»
function parseDate(s) {
  if (!s) return null;
  if (s instanceof Date) return s;
  let str = String(s).trim();
  if (/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}(:\d{2})?$/.test(str)) str = str.replace(' ', 'T') + 'Z';
  else if (/^\d{4}-\d{2}-\d{2}$/.test(str)) str += 'T00:00:00Z';
  const d = new Date(str);

function fmtDate(s, noTime) {
  const d = parseDate(s); if (!d) return '—';
  const base = pad2(d.getDate()) + '.' + pad2(d.getMonth() + 1) + '.' + d.getFullYear();

}
function fmtTime(s) { const d = parseDate(s); return d ? pad2(d.getHours()) + ':' + pad2(d.getMinutes()) : ''; }
function fmtAgo(s) {
  const d = parseDate(s); if (!d) return '';
  let sec = Math.round((Date.now() - d.getTime()) / 1000);
  const fut = sec < 0; sec = Math.abs(sec);
  let t;
  if (sec < 45) return fut ? 'через минуту' : 'только что';
  if (sec < 3600) t = Math.round(sec / 60) + ' мин';
  else if (sec < 172800) t = Math.round(sec / 3600) + ' ч';
  else if (sec < 5184000) { const n = Math.round(sec / 86400); t = n + ' ' + plural(n, ['день', 'дня', 'дней']); }

function dayKey(s) { const d = parseDate(s); return d ? d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) : ''; }

  const d = parseDate(s); if (!d) return '';
  try { return new Intl.DateTimeFormat('ru-RU', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(d); } catch (e) { return fmtDate(s, true); }
}
function fmtMoney(price, cur) { return (price === null || price === undefined) ? '—' : price + ' ' + (cur === 'EUR' || !cur ? '€' : cur); }
function trunc(s, n) { s = String(s == null ? '' : s); return s.length > n ? s.slice(0, n - 1).trimEnd() + '…' : s; }
function debounce(fn, ms) { let t; const f = (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; f.cancel = () => clearTimeout(t); return f; }
function safeDecode(s) { try { return decodeURIComponent(s); } catch (e) { return s; } }
let uid = 0;
const nextId = (p) => (p || 'x') + (++uid);

/* ═══════════════════════════════════════════════════════════════════════════
   2. Настройки и хранилище (всё в try/catch: в приватном режиме доступа может не быть)
   ═══════════════════════════════════════════════════════════════════════════ */
const DEFAULT_API = 'https://dzintars-api.estoniabolt.workers.dev';
const TOKEN_KEY = 'dz_admin_token';
const API_KEY = 'dz_admin_api';
const mkStore = (get) => ({
  get(k) { try { return get().getItem(k); } catch (e) { return null; } },

const store = mkStore(() => window.localStorage);
const sstore = mkStore(() => window.sessionStorage);
const API_OVERRIDDEN = (function () {
  let cand = null;

/* ───── Читалка переписки: «сейчас в чате» и сохранённые копии ───── */
const SNAP_LABEL = { REPORT_DEAL_CASE: 'Копия на момент жалобы', REPORT_DEAL: 'Копия на момент жалобы', REPORT_CONTENT: 'Копия на момент жалобы', REPORT_REVIEW: 'Копия на момент жалобы', ACCOUNT_DELETED: 'Копия при удалении аккаунта' };
function renderMessages(box, msgs, people) {
  box.replaceChildren();
  if (!msgs || !msgs.length) { box.appendChild(h('div.reader-empty', 'Сообщений нет')); return; }
  let day = '';
  for (const m of msgs) {
    const dk = dayKey(m.created_at);
    if (dk !== day) { day = dk; box.appendChild(h('div.day-sep', fmtDayLong(m.created_at))); }
    const sys = m.side !== 'BUYER' && m.side !== 'SELLER';
    const cls = m.side === 'SELLER' ? 'm-seller' : m.side === 'BUYER' ? 'm-buyer' : 'm-system';
    const who = sys ? null : P(people, m.sender_id);
    const erased = !!m.deleted_at && !m.text;
    box.appendChild(h('div.msg.' + cls, { 'data-side': m.side, 'data-msg': m.id },
      sys ? null : h('div.msg-who', h('strong', (m.side === 'SELLER' ? 'Продавец' : 'Покупатель') + ' · ' + personName(who)), who && who.ref ? refChip(who.ref, { size: 'sm' }) : null),
      h('div.bubble' + (erased ? '.is-del' : ''), erased ? 'Стёрто автором · ' + fmtDate(m.deleted_at) : String(m.text || '')),
      h('div.msg-time', fmtTime(m.created_at) + (m.edited_at ? ' · изменено' : ''))));
  }
  box.scrollTop = box.scrollHeight;
}
/* o: {ref, conv, people, live, truncated, snapshots, preloaded:{key: сообщения}, initial: 'live' | ключ копии} */
function convReader(o) {
  const people = o.people || {}, snaps = o.snapshots || [], cache = Object.assign({}, o.preloaded || {});
  const tabs = h('div.seg.reader-tabs', { role: 'group', 'aria-label': 'Какую версию переписки показать' });
  const note = h('p.reader-note.muted'), box = h('div.reader', { role: 'log', 'aria-label': 'Переписка' });
  const conv = o.conv || {};
  const head = h('div.reader-head', o.ref ? refChip(o.ref) : null,
    h('span', 'Покупатель: ', personInline(P(people, conv.buyer_id))), h('span', 'Продавец: ', personInline(P(people, conv.seller_id))));
  const hasErased = (o.live || []).some((m) => m.deleted_at);
  let seq = 0;
  const items = [{ key: 'live', label: 'Сейчас в чате (' + (o.live || []).length + ')', title: 'Как переписка выглядит сейчас' }]
    .concat(snaps.map((s) => ({ key: s.key, label: (SNAP_LABEL[s.source] || 'Копия') + ' · ' + fmtDate(s.created_at), title: 'Хранится до ' + (s.expires_at ? fmtDate(s.expires_at, true) : 'закрытия дела') + (s.message_count ? ' · сообщений: ' + s.message_count : ''), snap: s })));
  async function show(key) {
    const my = ++seq;
    $$('button', tabs).forEach((b) => b.setAttribute('aria-pressed', b.dataset.key === key ? 'true' : 'false'));
    if (key === 'live') {
      renderMessages(box, o.live, people);
      note.textContent = (o.truncated ? 'Показаны последние сообщения (переписка длиннее). ' : '') + (hasErased && snaps.length ? 'Часть сообщений стёрта авторами — их текст сохранён в копиях выше.' : hasErased ? 'Часть сообщений стёрта авторами; сохранённой копии нет.' : '');
      return;
    }
    const it = items.find((x) => x.key === key), s = it && it.snap;
    note.textContent = 'Сохранённая копия' + (s ? ' от ' + fmtDate(s.created_at) : '') + '. Хранится до ' + (s && s.expires_at ? fmtDate(s.expires_at, true) : 'закрытия дела') + '. Тексты в ней остаются, даже если автор потом стёр сообщения или удалил аккаунт.';
    if (!cache[key]) {
      box.replaceChildren(loadingBox());
      try {
        const r = await api('GET', '/api/admin/conversations/' + enc(o.ref), { query: { snapshot: key } });
        if (my !== seq) return;
        if (!r.snapshot) { box.replaceChildren(emptyBox('Эта копия уже удалена по сроку хранения.')); return; }
        cache[key] = r.snapshot.messages || [];
      } catch (e) { if (my === seq && !isAbort(e)) box.replaceChildren(errorBox(e, () => show(key))); return; }
    }
    if (my === seq) renderMessages(box, cache[key], people);
  }
  items.forEach((it) => tabs.appendChild(h('button', { type: 'button', 'data-key': it.key, title: it.title, 'aria-pressed': 'false', onclick: () => show(it.key) }, it.label)));
  const root = h('div.reader-wrap', head, items.length > 1 ? tabs : null, note, box);
  show(items.some((x) => x.key === o.initial) ? o.initial : 'live');
  return root;
}

          days.length ? h('div.audit-list', days.map((d) => h('div.audit-row', h('div.muted', d), h('div', 'Push: ' + num(d, 'push', 'sent') + (num(d, 'push', 'failed') ? ' (сбоев: ' + num(d, 'push', 'failed') + ')' : '') + ' · Письма: ' + num(d, 'email', 'sent') + (num(d, 'email', 'failed') ? ' (сбоев: ' + num(d, 'email', 'failed') + ')' : ''))))) : h('p.faint', 'Пока ничего не отправлялось.')));
    } catch (e) { if (isAbort(e) || !ctx.alive()) return; host.replaceChildren(errorBox(e, load)); }
  }
  return load();
}, 'notify');


/* ═══════════════════════════════════════════════════════════════════════════
   99. Запуск
   ═══════════════════════════════════════════════════════════════════════════ */
boot();
})();
