<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="app.title">Dzintars — sludinājumi Latvijā</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/home.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="topbar-row">
      <label class="search-field">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
          <path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input type="text" data-i18n-placeholder="search.placeholder" placeholder="Meklēt visos reģionos…">
      </label>
      <button class="icon-btn-ghost" type="button" aria-label="Filtri">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 6H20M8 12H16M11 18H13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      <a href="auth.html" class="btn-signin" data-i18n="nav.signin">Ienākt</a>
    </div>

    <div class="foryou-banner">
      <div class="foryou-text">
        <span class="foryou-title" data-i18n="home.foryou.title">Kartītes tev</span>
        <span class="foryou-sub" data-i18n="home.foryou.sub">Pēc taviem meklējumiem un pilsētas</span>
      </div>
      <svg class="foryou-arrow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M9 6L15 12L9 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </header>

  <div class="page-scroll">

    <!-- Category grid: two rows, horizontal scroll, custom duotone icons -->
    <nav class="category-scroller" aria-label="Kategorijas">

      <a class="cat-tile" href="#">
        <span class="cat-tile-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 16V9L12 4L20 9V16" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="M9 20V13H15V20" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="cat-tile-label" data-i18n="cat.realestate">Nekustamais īpašums</span>
      </a>

      <a class="cat-tile" href="#">
        <span class="cat-tile-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 16L5.5 10.5C5.8 9.4 6.8 8.7 8 8.7H16C17.2 8.7 18.2 9.4 18.5 10.5L20 16" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            <rect x="3" y="16" width="18" height="4" rx="1.4" stroke="currentColor" stroke-width="1.8"/>
            <circle cx="7.5" cy="20" r="1" fill="currentColor"/>
            <circle cx="16.5" cy="20" r="1" fill="currentColor"/>
          </svg>
        </span>
        <span class="cat-tile-label" data-i18n="cat.transport">Transports</span>
      </a>

      <a class="cat-tile" href="#">
        <span class="cat-tile-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="3.4" stroke="currentColor" stroke-width="1.8"/>
            <path d="M12 4V6.2M12 17.8V20M20 12H17.8M6.2 12H4M17 7L15.4 8.6M8.6 15.4L7 17M17 17L15.4 15.4M8.6 8.6L7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="cat-tile-label" data-i18n="cat.parts">Rezerves daļas</span>
      </a>

      <a class="cat-tile" href="#">
        <span class="cat-tile-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 5L6 8V19C6 19.6 6.4 20 7 20H17C17.6 20 18 19.6 18 19V8L16 5" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="M9 5C9 6.7 10.3 8 12 8C13.7 8 15 6.7 15 5" stroke="currentColor" stroke-width="1.8"/>
          </svg>
        </span>
        <span class="cat-tile-label" data-i18n="cat.clothes">Apģērbs, apavi</span>
      </a>

      <a class="cat-tile" href="#">
        <span class="cat-tile-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 3L14 8L19.5 8.7L15.5 12.4L16.6 18L12 15.3L7.4 18L8.5 12.4L4.5 8.7L10 8L12 3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="cat-tile-label" data-i18n="cat.services">Pakalpojumi</span>
      </a>

      <a class="cat-tile" href="#">
        <span class="cat-tile-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="4" y="6" width="16" height="12" rx="1.5" stroke="currentColor" stroke-width="1.8"/>
            <path d="M9 6V4.6C9 4.3 9.3 4 9.6 4H14.4C14.7 4 15 4.3 15 4.6V6" stroke="currentColor" stroke-width="1.8"/>
          </svg>
        </span>
        <span class="cat-tile-label" data-i18n="cat.jobs">Darbs</span>
      </a>

      <a class="cat-tile" href="#">
        <span class="cat-tile-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 8H20L18.5 19H5.5L4 8Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="M8 8V6C8 4.3 9.3 3 11 3H13C14.7 3 16 4.3 16 6V8" stroke="currentColor" stroke-width="1.8"/>
          </svg>
        </span>
        <span class="cat-tile-label" data-i18n="cat.business">Bizness 360</span>
      </a>

      <a class="cat-tile" href="#">
        <span class="cat-tile-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 20V13C4 10.2 6.2 8 9 8H10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <rect x="10" y="4" width="10" height="7" rx="1.4" stroke="currentColor" stroke-width="1.8"/>
            <circle cx="9" cy="17" r="2" stroke="currentColor" stroke-width="1.8"/>
          </svg>
        </span>
        <span class="cat-tile-label" data-i18n="cat.home">Mājai un dārzam</span>
      </a>

    </nav>

    <h2 class="section-heading" data-i18n="home.recommended">Ieteiktie sludinājumi</h2>

    <!-- Empty listing placeholders: fixed dimensions, ready for real data.
         Each card = 1:1 photo + 2-line title + price line + location line. -->
    <div class="listing-grid" id="listing-grid">
      <!-- 8 placeholders rendered by JS to keep markup DRY; static fallback below for no-JS -->
      <noscript>
        <article class="listing-card is-empty">
          <div class="listing-photo">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.6"/><circle cx="8.5" cy="10" r="1.5" stroke="currentColor" stroke-width="1.6"/><path d="M3 16L8 12L12 15L16 11L21 16" stroke="currentColor" stroke-width="1.6"/></svg>
          </div>
          <div class="listing-body">
            <div class="listing-title">&nbsp;</div>
            <div class="listing-price">&nbsp;</div>
            <div class="listing-location">&nbsp;</div>
          </div>
        </article>
      </noscript>
    </div>

  </div>

  <nav class="tabbar" aria-label="Galvenā navigācija">
    <button class="tab-item is-active" type="button">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span data-i18n="tab.search">Meklēt</span>
    </button>
    <button class="tab-item" type="button">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 20.5C12 20.5 4 15.6 4 9.9C4 7.2 6.1 5 8.7 5C10.1 5 11.4 5.7 12 6.8C12.6 5.7 13.9 5 15.3 5C17.9 5 20 7.2 20 9.9C20 15.6 12 20.5 12 20.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span data-i18n="tab.favorites">Izlase</span>
    </button>
    <button class="tab-item" type="button">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="4" y="4" width="16" height="16" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M8 12H16M12 8V16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span data-i18n="tab.listings">Sludinājumi</span>
    </button>
    <button class="tab-item" type="button">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 5H20V16H8L4 19V5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span data-i18n="tab.messages">Ziņas</span>
    </button>
    <a class="tab-item" href="auth.html">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="8" r="3.4" stroke="currentColor" stroke-width="1.8"/><path d="M5 20C5 16.7 8.1 14 12 14C15.9 14 19 16.7 19 20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span data-i18n="tab.profile">Profils</span>
    </a>
  </nav>

</div>

<script src="js/i18n.js"></script>
<script src="js/home.js"></script>
</body>
</html>
